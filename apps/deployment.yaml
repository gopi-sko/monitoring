apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-sample
  namespace: openedx
  labels:
    app: nginx-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-sample
  template:
    metadata:
      labels:
        app: nginx-sample
    spec:
      initContainers:
      - name: init-html
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          cat > /data/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Sample App</title></head>
          <body>
            <h1>Minikube Sample App</h1>
            <p>Pod: $HOSTNAME</p>
            <p>Monitoring: Prometheus + Grafana + AlertManager</p>
          </body>
          </html>
          EOF
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sample-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-sample
  namespace: openedx
spec:
  selector:
    app: nginx-sample
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
